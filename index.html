const $=id=>document.getElementById(id),cv=$('view'),cfg={count:220000,size:.85,opacity:.46,travel:5,hold:2.5,flow:5,halo:12,edge:.76,routeMix:.7,mix:.2};

function graph(p){let n=p.nodes.length,d=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?0:1e6)),next=Array.from({length:n},()=>Array(n).fill(-1));for(let [a,b] of p.links){d[a][b]=d[b][a]=Math.hypot(p.nodes[a][0]-p.nodes[b][0],p.nodes[a][1]-p.nodes[b][1]);next[a][b]=b;next[b][a]=a}for(let k=0;k<n;k++)for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(d[i][k]+d[k][j]<d[i][j]){d[i][j]=d[i][k]+d[k][j];next[i][j]=next[i][k]}return next}plans.forEach(p=>p.next=graph(p));

const VS=`#version 300 es
precision highp float;layout(location=0) in vec4 a;layout(location=1) in vec4 b;layout(location=2) in vec4 ca;layout(location=3) in vec4 cb;layout(location=4) in vec4 seed;uniform vec2 uDim;uniform float uT,uTime,uFlow,uHalo,uSize,uScale,uRouteMix;uniform int uMode,uPlan;uniform vec2 nodes[12];uniform int hops[144];out vec4 vColor;out float vSeed;
float sm(float t){return t*t*(3.-2.*t);}vec2 drift(vec2 p,vec2 tangent,float t){float q=sin(t*.6+seed.x*45.+p.x*.013);float r=cos(t*.44+seed.y*39.+p.y*.011);return tangent*q*uHalo*(.25+.75*seed.z)+vec2(-tangent.y,tangent.x)*r*uHalo*.25;}
int nearest(vec2 q){int n=0;float best=1e9;for(int j=0;j<12;j++){float d=distance(q,nodes[j]);if(d<best){best=d;n=j;}}return n;}
vec2 house(vec2 x,vec2 y,float t){int f=nearest(x),l=nearest(y);vec2 pts[15];pts[0]=x;pts[1]=nodes[f];int k=2;for(int j=0;j<11;j++){if(f==l)break;int n=hops[f*12+l];if(n<0)break;f=n;pts[k]=nodes[f];k++;}pts[k]=y;float len=0.;for(int j=0;j<14;j++){if(j>=k)break;len+=distance(pts[j],pts[j+1]);}float left=t*len;vec2 p=y;for(int j=0;j<14;j++){if(j>=k)break;float d=distance(pts[j],pts[j+1]);if(left<=d||j==k-1){p=mix(pts[j],pts[j+1],clamp(left/max(d,.001),0.,1.));break;}left-=d;}return p;}
void main(){float t=sm(clamp((uT-seed.x*.20)/.80,0.,1.));vec2 x=a.xy,y=b.xy,p=mix(x,y,t);if(uMode==1){vec2 z=seed.y>.5?vec2(y.x,x.y):vec2(x.x,y.y);p=mix(p,t<.5?mix(x,z,sm(t*2.)):mix(z,y,sm(t*2.-1.)),uRouteMix);}else if(uMode==2 && seed.y<uRouteMix){p=house(x,y,t);}else{p+=vec2(sin(seed.x*31.+t*6.),cos(seed.y*24.+t*5.))*sin(t*3.14159)*uHalo*2.;}vec2 tan=mix(a.zw,b.zw,t);tan=normalize(tan+vec2(.0001,0.));p+=drift(p,tan,uTime*uFlow*.4)*( .55+.45*abs(2.*t-1.));gl_Position=vec4(p.x/uDim.x*2.-1.,1.-p.y/uDim.y*2.,0.,1.);gl_PointSize=max(1.,uSize*uScale);vColor=mix(ca,cb,t);vSeed=seed.w;}`;
const FS=`#version 300 es
precision highp float;in vec4 vColor;in float vSeed;uniform vec3 uA,uB;uniform float uOpacity,uMix,uSize,uScale;uniform int uColor;out vec4 outColor;void main(){float d=length(gl_PointCoord-.5);float alpha=(1.-smoothstep(.25,.5,d))*min(1.,uSize*uScale*uSize*uScale);vec3 c=uColor==2?vColor.rgb:uColor==1&&vSeed<uMix?uB:uA;outColor=vec4(c,alpha*uOpacity);}`;
function program(v,f){let p=gl.createProgram();for(let [type,src] of [[gl.VERTEX_SHADER,v],[gl.FRAGMENT_SHADER,f]]){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));gl.attachShader(p,s)}gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}let prog;try{prog=program(VS,FS)}catch(e){status(e.message);throw e}gl.useProgram(prog);const buffers=Array.from({length:5},(_,i)=>{let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,4,gl.FLOAT,false,0,0);return b});const U={};for(let k of ['uDim','uT','uTime','uFlow','uHalo','uSize','uScale','uRouteMix','uMode','uPlan','nodes[0]','hops[0]','uA','uB','uOpacity','uMix','uColor'])U[k]=gl.getUniformLocation(prog,k);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
function put(i,data){gl.bindBuffer(gl.ARRAY_BUFFER,buffers[i]);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW)}function rgb(s){return [1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255)}
function canvas(w,h){let c=document.createElement('canvas');c.width=w;c.height=h;return c}
function scan(s){let ratio=Math.min(1,2600/Math.max(s.w,s.h)),w=Math.max(1,Math.round(s.w*ratio)),h=Math.max(1,Math.round(s.h*ratio)),c=canvas(w,h),g=c.getContext('2d',{willReadFrequently:true});g.drawImage(s.img,0,0,w,h);let d=g.getImageData(0,0,w,h).data,mask=new Float32Array(w*h),transparent=0,bg=0,nb=0;for(let i=0;i<w*h;i++){if(d[i*4+3]<128)transparent++;let x=i%w,y=Math.floor(i/w);if(x===0||x===w-1||y===0||y===h-1){bg+=.2126*d[i*4]+.7152*d[i*4+1]+.0722*d[i*4+2];nb++}}let mode=$('sampling').value;if(mode==='auto')mode=transparent>w*h*.01?'alpha':bg/nb>128?'dark':'light';for(let i=0;i<w*h;i++){let j=i*4,a=d[j+3]/255,l=(.2126*d[j]+.7152*d[j+1]+.0722*d[j+2])/255;mask[i]=mode==='alpha'?a:mode==='light'?a*l:mode==='edge'?a*l:a*(1-l)}let edge=[],fill=[];let step=Math.max(1,Math.floor(Math.sqrt(w*h/1000000)));for(let y=1;y<h-1;y+=step)for(let x=1;x<w-1;x+=step){let i=y*w+x,j=i*4,dx=mask[i+1]-mask[i-1],dy=mask[i+w]-mask[i-w],mag=Math.hypot(dx,dy);if(mag>.12)edge.push(i);if(mask[i]>.36&&mode!=='edge')fill.push(i)}if(!edge.length&&!fill.length)return null;return {w,h,d,mask,edge,fill,ratio,mode}}
function sample(s){let m=s.scan,n=cfg.count,pos=new Float32Array(n*4),col=new Float32Array(n*4),a=m.edge.length?m.edge:m.fill,b=m.fill.length?m.fill:a;let xoff=(W-s.w)/2,yoff=(H-s.h)/2;for(let i=0;i<n;i++){let pool=i<n*cfg.edge?a:b,idx=pool[Math.min(pool.length-1,Math.floor(((i%(Math.max(1,Math.floor(n* (i<n*cfg.edge?cfg.edge:1-cfg.edge)))))+Math.random())/Math.max(1,Math.floor(n*(i<n*cfg.edge?cfg.edge:1-cfg.edge)))*pool.length))];if(idx===undefined)idx=pool[Math.floor(Math.random()*pool.length)];let x=idx%m.w,y=Math.floor(idx/m.w),dx=m.mask[idx+1]-m.mask[idx-1],dy=m.mask[idx+m.w]-m.mask[idx-m.w],l=Math.hypot(dx,dy);let j=i*4;pos[j]=xoff+(x+Math.random())*s.w/m.w;pos[j+1]=yoff+(y+Math.random())*s.h/m.h;pos[j+2]=l>.01?-dy/l:1;pos[j+3]=l>.01?dx/l:0;col[j]=m.d[idx*4]/255;col[j+1]=m.d[idx*4+1]/255;col[j+2]=m.d[idx*4+2]/255;col[j+3]=1}return {pos,col}}
function fit(){let scale=+$('res').value,max=gl.getParameter(gl.MAX_VIEWPORT_DIMS);scale=Math.min(scale,max[0]/W,max[1]/H,Math.sqrt(18000000/(W*H)));cv.width=Math.max(1,Math.round(W*scale));cv.height=Math.max(1,Math.round(H*scale));let st=$('stage'),r=Math.min((st.clientWidth-48)/W,(st.clientHeight-48)/H);cv.style.width=Math.max(1,W*r)+'px';cv.style.height=Math.max(1,H*r)+'px';gl.viewport(0,0,cv.width,cv.height);$('meta').textContent=`${scenes.length} designs · ${W} × ${H} px · saída ${cv.width} × ${cv.height}`}
let samples=[],seeds;function rebuild(){ready=false;if(!scenes.length){$('empty').style.display='grid';$('meta').textContent='Sem composições.';renderList();return}W=Math.max(...scenes.map(s=>s.w));H=Math.max(...scenes.map(s=>s.h));fit();target=Math.min(target,scenes.length-1);previous=target;samples=scenes.map(sample);seeds=new Float32Array(cfg.count*4);for(let i=0;i<seeds.length;i++)seeds[i]=Math.random();put(4,seeds);put(0,samples[target].pos);put(1,samples[target].pos);put(2,samples[target].col);put(3,samples[target].col);elapsed=cfg.travel;ready=true;$('empty').style.display='none';renderList()}
function go(i){if(!ready||scenes.length<2||i===target)return;previous=target;target=i;put(0,samples[previous].pos);put(1,samples[target].pos);put(2,samples[previous].col);put(3,samples[target].col);elapsed=0;planIndex=$('plan').value==='3'?(planIndex+1)%3:+$('plan').value;renderList()}
function renderList(){let e=$('scenes');e.replaceChildren();scenes.forEach((s,i)=>{let r=document.createElement('div');r.className='scene'+(i===target?' active':'');let im=document.createElement('img');im.src=s.url;r.append(im);let name=document.createElement('span');name.textContent=s.name;name.title=s.name;name.onclick=()=>go(i);r.append(name);for(let [text,fn] of [['↑',()=>{if(i>0){[scenes[i-1],scenes[i]]=[scenes[i],scenes[i-1]];rebuild()}}],['↓',()=>{if(i<scenes.length-1){[scenes[i+1],scenes[i]]=[scenes[i],scenes[i+1]];rebuild()}}],['×',()=>{URL.revokeObjectURL(s.url);scenes.splice(i,1);rebuild()}]]){let b=document.createElement('button');b.textContent=text;b.onclick=()=>{if(!recording)fn()};r.append(b)}e.append(r)})}
const overlay=document.createElement('canvas');overlay.style.cssText='position:absolute;pointer-events:none;box-shadow:none;display:none';$('stage').append(overlay);function guide(p){if(!$('showPlan').checked||!ready){overlay.style.display='none';return}overlay.style.display='block';overlay.style.width=cv.style.width;overlay.style.height=cv.style.height;let w=overlay.width=1000,h=overlay.height=Math.round(1000*H/W),g=overlay.getContext('2d');g.strokeStyle='rgba(110,140,130,.5)';g.lineWidth=1.5;for(let [x,y,X,Y] of p.walls)g.strokeRect(x*w,y*h,(X-x)*w,(Y-y)*h);g.strokeStyle='rgba(200,100,60,.65)';g.setLineDash([5,5]);g.beginPath();for(let [a,b] of p.links){g.moveTo(p.nodes[a][0]*w,p.nodes[a][1]*h);g.lineTo(p.nodes[b][0]*w,p.nodes[b][1]*h)}g.stroke();g.setLineDash([])}
function draw(){let bg=rgb($('bg').value);gl.clearColor(...bg,1);gl.clear(gl.COLOR_BUFFER_BIT);if(!ready)return;let p=plans[planIndex],nodes=new Float32Array(24),hops=new Int32Array(144).fill(-1);for(let i=0;i<12;i++){let xy=p.nodes[i]||p.nodes[0];nodes[i*2]=xy[0]*W;nodes[i*2+1]=xy[1]*H;for(let j=0;j<p.nodes.length;j++)if(i<p.nodes.length)hops[i*12+j]=p.next[i][j]}gl.uniform2fv(U['nodes[0]'],nodes);gl.uniform1iv(U['hops[0]'],hops);gl.uniform2f(U.uDim,W,H);for(let [k,v] of Object.entries({uT:Math.min(1,elapsed/cfg.travel),uTime:time,uFlow:cfg.flow,uHalo:cfg.halo,uSize:cfg.size,uScale:cv.width/W,uRouteMix:cfg.routeMix,uOpacity:cfg.opacity,uMix:cfg.mix}))gl.uniform1f(U[k],v);gl.uniform1i(U.uMode,({free:0,ortho:1,house:2})[$('route').value]);gl.uniform1i(U.uColor,({solid:0,mix:1,source:2})[$('colorMode').value]);gl.uniform3fv(U.uA,rgb($('fg').value));gl.uniform3fv(U.uB,rgb($('accent').value));gl.drawArrays(gl.POINTS,0,cfg.count);}
function tick(now){let dt=Math.min(.06,(now-last)/1000||0);last=now;if(!paused){time+=dt;elapsed+=dt;if(ready&&$('auto').checked&&elapsed>=cfg.travel+cfg.hold&&scenes.length>1)go((target+1)%scenes.length)}draw();if($('showPlan').checked)guide(plans[planIndex]);else overlay.style.display='none';requestAnimationFrame(tick)}
async function load(files){if(loading||recording)return;loading=true;status('A analisar designs…');let errors=[];for(let f of files){let url=URL.createObjectURL(f);try{let img=new Image();img.src=url;await img.decode();let s={name:f.name,url,img,w:img.naturalWidth,h:img.naturalHeight};s.scan=scan(s);if(!s.scan)throw Error('sem traços');scenes.push(s)}catch(e){errors.push(f.name);URL.revokeObjectURL(url)}}rebuild();status(errors.length?'Sem traços ou formato incompatível: '+errors.join(', '):'Designs carregados.');loading=false}
$('upload').onclick=()=>$('files').click();$('files').onchange=e=>{load([...e.target.files]);e.target.value=''};$('stage').ondragover=e=>e.preventDefault();$('stage').ondrop=e=>{e.preventDefault();load([...e.dataTransfer.files])};$('sampling').onchange=()=>{for(let s of scenes){let n=scan(s);if(n)s.scan=n}rebuild()};$('next').onclick=()=>go((target+1)%scenes.length);$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'Retomar':'Pausa'};$('plan').onchange=()=>{if($('plan').value!=='3')planIndex=+$('plan').value};$('res').onchange=()=>{if(!recording)fit()};window.addEventListener('resize',()=>{if(ready&&!recording)fit()});function dl(b,n){if(!b)return;let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}$('png').onclick=()=>{if(ready){draw();cv.toBlob(b=>dl(b,'particle-architecture.png'))}};$('video').onclick=()=>{if(recording){recording.stop();return}if(!ready)return;try{let stream=cv.captureStream(30),type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));recording=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:18000000}:{videoBitsPerSecond:18000000});let chunks=[];recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recording.onstop=()=>{let mime=recording.mimeType;dl(new Blob(chunks,{type:mime}),'particle-architecture.'+(mime.includes('mp4')?'mp4':'webm'));stream.getTracks().forEach(t=>t.stop());recording=null;$('video').textContent='Gravar vídeo';$('res').disabled=false;status('Vídeo exportado.')};recording.start();$('res').disabled=true;$('video').textContent='Parar gravação';status('A gravar…')}catch(e){recording=null;status('Gravação indisponível neste navegador.')}};requestAnimationFrame(tick);
</script></body></html>
